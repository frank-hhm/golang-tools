<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tools</title>
    <style>
        /*
          启动骨架层：盖在 #app 之外的一块自绘「玻璃」，接管「窗口已经亮出来、
          但 Vue 还没挂载完」那段时间。没有它，这段时间露的是裸底色。
          底色由 Go 侧 WindowBackground() 按主题取，与这里的两套底色同档
          （Arco --color-bg-1：浅色 #FFFFFF / 暗黑 #17171A），所以衔接处看不出来。
          说是玻璃，其实是自绘质感：柔和高光 + 细斜纹颗粒 + 骨架条扫光，
          盖不住也模糊不了窗口外的东西——真要透视只能走 Win32 分层透明。
        */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 2147483000;
            overflow: hidden;
            /* 骨架期间没有可交互内容，别挡点击 */
            pointer-events: none;
            background-color: #fff;
            background-image:
                radial-gradient(120% 90% at 18% 0%, rgba(22, 93, 255, .07), transparent 60%),
                radial-gradient(100% 80% at 100% 100%, rgba(120, 120, 140, .10), transparent 55%),
                repeating-linear-gradient(135deg, rgba(128, 128, 140, .035) 0 6px, transparent 6px 12px);
            /* 兜底：万一 JS 出错没走到淡出，3.2s 后骨架自己退场，绝不永久盖着页面 */
            animation: bootGuard .4s ease 3.2s forwards;
        }

        #boot.dk {
            background-color: #17171a;
            background-image:
                radial-gradient(120% 90% at 18% 0%, rgba(90, 140, 255, .10), transparent 60%),
                radial-gradient(100% 80% at 100% 100%, rgba(255, 255, 255, .05), transparent 55%),
                repeating-linear-gradient(135deg, rgba(255, 255, 255, .028) 0 6px, transparent 6px 12px);
        }

        /* 原生材质档（background.type=native）：窗口是 DWM 透明+Acrylic 建的，
           骨架的实色底会把桌面模糊整个盖住——这档下骨架只留骨架条不铺底 */
        #boot.native,
        #boot.native.dk {
            background-color: transparent;
            background-image: none;
        }

        /* 版式对齐工具窗：自绘标题栏一条 + 内容区一组卡片 */
        #boot .boot-tb {
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            padding: 0 14px;
            box-sizing: border-box;
        }

        #boot .boot-dot {
            width: 18px;
            height: 18px;
            border-radius: 6px;
        }

        #boot .boot-bar {
            width: 150px;
            height: 12px;
            border-radius: 6px;
        }

        #boot .boot-body {
            padding: 18px 20px;
        }

        #boot .boot-line {
            width: 220px;
            height: 14px;
            border-radius: 7px;
            margin-bottom: 16px;
        }

        #boot .boot-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-width: 920px;
        }

        #boot .boot-cards i {
            display: block;
            height: 96px;
            border-radius: 10px;
        }

        /*
          分栏版式：左「参数设置」窄卡 + 右「预览/主面板」宽卡，对齐 qrcode/redis/git
          等 24 栅格下 span6+span18（约 25%）与 mysql/php 的 span8+span16（约 33%）页面。
          默认隐藏，仅当内联脚本按 location.hash 命中分栏路由、给 #boot 挂上
          lay-split 时才显示（同时收起上面的通用卡片网格），版式与真实内容一致。
        */
        #boot .boot-split {
            display: none;
            gap: 12px;
            align-items: stretch;
        }

        #boot.lay-split .boot-grid {
            display: none;
        }

        #boot.lay-split .boot-split {
            display: flex;
            height: 100%;
        }

        /* 分栏下让内容区撑满标题栏以下的整块高度，两张卡随行高铺到底 */
        #boot.lay-split .boot-body {
            height: calc(100% - 40px);
            box-sizing: border-box;
        }

        #boot .boot-col-side {
            flex: 0 0 25%;
            min-width: 0;
        }

        #boot.lay-split.r33 .boot-col-side {
            flex-basis: 33.333%;
        }

        #boot .boot-col-main {
            flex: 1 1 auto;
            min-width: 0;
        }

        #boot .boot-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
            padding: 14px;
            border-radius: 10px;
            /* 描边随主题「描边强度」：下方内联脚本按 cfg.glass.border 算好写进 --boot-card-border；
               玻璃关时不写该变量，落回这里的默认档中性描边（浅/暗各一档）。 */
            border: 1px solid var(--boot-card-border, rgba(128, 128, 140, .16));
            background: rgba(128, 128, 140, .05);
        }

        #boot.dk .boot-card {
            border-color: var(--boot-card-border, rgba(255, 255, 255, .09));
            background: rgba(255, 255, 255, .025);
        }

        #boot .boot-card-hd {
            width: 42%;
            height: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        #boot .boot-field {
            height: 28px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        #boot .boot-field-tall {
            height: 64px;
        }

        #boot .boot-btn {
            height: 30px;
            border-radius: 6px;
            margin-top: auto;
        }

        #boot .boot-stage {
            flex: 1 1 auto;
            min-height: 160px;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        #boot .boot-foot {
            width: 46%;
            height: 14px;
            border-radius: 7px;
        }

        #boot .boot-dot,
        #boot .boot-bar,
        #boot .boot-line,
        #boot .boot-cards i,
        #boot .boot-card-hd,
        #boot .boot-field,
        #boot .boot-btn,
        #boot .boot-stage,
        #boot .boot-foot {
            position: relative;
            overflow: hidden;
            background: rgba(128, 128, 140, .14);
        }

        #boot.dk .boot-dot,
        #boot.dk .boot-bar,
        #boot.dk .boot-line,
        #boot.dk .boot-cards i,
        #boot.dk .boot-card-hd,
        #boot.dk .boot-field,
        #boot.dk .boot-btn,
        #boot.dk .boot-stage,
        #boot.dk .boot-foot {
            background: rgba(255, 255, 255, .06);
        }

        #boot .boot-dot::after,
        #boot .boot-bar::after,
        #boot .boot-line::after,
        #boot .boot-cards i::after,
        #boot .boot-card-hd::after,
        #boot .boot-field::after,
        #boot .boot-btn::after,
        #boot .boot-stage::after,
        #boot .boot-foot::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent 25%, rgba(255, 255, 255, .38) 50%, transparent 75%);
            transform: translateX(-100%);
            animation: bootShine 1.35s ease-in-out infinite;
        }

        #boot.dk .boot-dot::after,
        #boot.dk .boot-bar::after,
        #boot.dk .boot-line::after,
        #boot.dk .boot-cards i::after,
        #boot.dk .boot-card-hd::after,
        #boot.dk .boot-field::after,
        #boot.dk .boot-btn::after,
        #boot.dk .boot-stage::after,
        #boot.dk .boot-foot::after {
            background: linear-gradient(100deg, transparent 25%, rgba(255, 255, 255, .10) 50%, transparent 75%);
        }

        @keyframes bootShine {
            to {
                transform: translateX(100%);
            }
        }

        @keyframes bootGuard {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* 前端挂载完成后走这条路径淡出（比兜底动画早得多） */
        #boot.off {
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s ease, visibility .2s ease;
        }

        @media (prefers-reduced-motion: reduce) {

            #boot .boot-dot::after,
            #boot .boot-bar::after,
            #boot .boot-line::after,
            #boot .boot-cards i::after,
            #boot .boot-card-hd::after,
            #boot .boot-field::after,
            #boot .boot-btn::after,
            #boot .boot-stage::after,
            #boot .boot-foot::after {
                animation: none;
            }
        }
    </style>
</head>
<body>
<div id="app"></div>
<!--
  骨架层放在 #app 之外：Vue 挂载会整体替换 #app 的内容，写在里面会被连根拔掉。
  主题在打包资源之前就要定下来，所以这里用一小段内联脚本读 localStorage 的
  app-theme-mode（与 utils/theme.ts 的 THEME_STORAGE_KEY 同一个键），
  auto 时问系统的 prefers-color-scheme。
-->
<div id="boot" aria-hidden="true">
    <div class="boot-tb"><i class="boot-dot"></i><i class="boot-bar"></i></div>
    <div class="boot-body">
        <div class="boot-grid">
            <div class="boot-line"></div>
            <div class="boot-cards"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="boot-split">
            <div class="boot-col boot-col-side">
                <div class="boot-card">
                    <i class="boot-card-hd"></i>
                    <i class="boot-field boot-field-tall"></i>
                    <i class="boot-field"></i>
                    <i class="boot-field"></i>
                    <i class="boot-field"></i>
                    <i class="boot-btn"></i>
                </div>
            </div>
            <div class="boot-col boot-col-main">
                <div class="boot-card">
                    <i class="boot-card-hd"></i>
                    <i class="boot-stage"></i>
                    <i class="boot-foot"></i>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    (function () {
        try {
            var el = document.getElementById("boot");
            var mode = localStorage.getItem("app-theme-mode") || "light";
            var dark = mode === "dark" ||
                (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (dark) el.classList.add("dk");
            // 整套配置里读了背景档：native 下骨架不铺实色底，免得启动瞬间盖住 DWM 桌面模糊
            var cfg = JSON.parse(localStorage.getItem("app-theme-cfg") || "null");
            if (cfg && cfg.background && cfg.background.type === "native") {
                el.classList.add("native");
            }
            // 卡片描边随主题「描边强度」：口径与 tokens.scss 玻璃卡片一致——
            // flush（无边距档）归无；玻璃开则 rgba(255,255,255, border/100)，暗色再 ×0.4；
            // 玻璃关则不写变量，落回 CSS 里默认档的中性描边兜底（浅/暗各一档）。
            if (cfg) {
                if (cfg.flush) {
                    el.style.setProperty("--boot-card-border", "transparent");
                } else if (cfg.glass && cfg.glass.on) {
                    var b = (typeof cfg.glass.border === "number" ? cfg.glass.border : 0) / 100;
                    var a = dark ? b * 0.4 : b;
                    el.style.setProperty("--boot-card-border", "rgba(255,255,255," + a.toFixed(3) + ")");
                }
            }
            // 按路由感知版式：分栏页（左窄卡+右宽卡）用 split 骨架，其余保持通用卡片网格。
            // 工具窗以 #/win/tools/<key> 或 #/tools/<key> 打开，取末尾 key 比对。
            // settings 是真两栏（左分类导航 span5≈21% + 右表单 span19），归入 25% 档（最接近），
            // 否则落回通用四卡网格，与设置页版式完全不符（用户反馈「设置页的骨架不对」）。
            var SPLIT25 = { clouddrive: 1, encdec: 1, git: 1, hexconvert: 1, npm: 1, qrcode: 1,
                redis: 1, settings: 1, strrandom: 1, timestamp: 1, usbserial: 1, video: 1, websocket: 1 };
            var SPLIT33 = { mysql: 1, php: 1 };
            var m = (location.hash || "").match(/[#\/]tools\/([a-z0-9]+)/i);
            var key = m && m[1].toLowerCase();
            if (key && SPLIT25[key]) el.classList.add("lay-split");
            else if (key && SPLIT33[key]) el.classList.add("lay-split", "r33");
        } catch (e) {
            /* 隐私模式读不到 localStorage 就按浅色画，不影响后续挂载 */
        }
    })();
</script>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
